<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все книги</title>
</head>
<body>

<form th:method="POST" th:action="@{/books/search}">
    <label for="request">Введите поисковый запрос: </label>
    <input type="text" id="request" name="request">
    <br/>
    <input type="submit" value="Искать!"/>
</form>

<div th:if="${books}">
    <div th:if="${books.isEmpty()}">
        <span>Книг не найдено</span>
    </div>

    <div th:each="book : ${books}">
        <p th:text="${book.getTitle + ', ' + book.getAuthor + ', ' + book.getYear}">book</p>

        <span th:if="${book.getOwner() != null}">
                Книга сейчас у: <span th:text="${book.owner.name}">Person Name</span>
            </span>

        <span th:if="${book.getOwner() == null}">
                Книга свободна
            </span>
    </div>
</div>

</body>
</html>
